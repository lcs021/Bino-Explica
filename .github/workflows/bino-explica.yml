name: Bino Explica (grátis)

on:
  schedule:
    # Horários em UTC: 20:47 UTC = 17:47 em Brasília. Segunda, quarta e sexta.
    - cron: "47 20 * * 1,3,5"
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
    inputs:
      tema:
        description: "Tema (vazio = próximo da fila)"
        required: false
      formato:
        description: "Formato do vídeo"
        type: choice
        default: auto
        options: [auto, explicacao, top5, mito_ou_verdade, quiz]
      sem_publicar:
        description: "Só criar os vídeos, sem publicar (teste)"
        type: boolean
        default: false

permissions:
  contents: write             # salvar o histórico (não repetir temas)

concurrency:
  group: bino-explica
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg, desenhista de SVG e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-dejavu-core
          mkdir -p assets/fontes
          curl -fsSL -o assets/fontes/GochiHand-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/gochihand/GochiHand-Regular.ttf || echo "fonte manuscrita indisponível; usando a padrão"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar (e publicar) o vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FONTE_LEGENDA: "Gochi Hand"
          FONTES_DIR: ${{ github.workspace }}/assets/fontes
          ESTILO_LEGENDA: rabisco
          ZOOM_VIDEO: "0.06"
          TEMA: ${{ inputs.tema }}
          SEM_PUBLICAR: ${{ inputs.sem_publicar }}
          FORMATO: ${{ inputs.formato }}
        run: |
          ARGS=()
          if [ -n "$TEMA" ]; then ARGS+=(--tema "$TEMA"); fi
          if [ "$SEM_PUBLICAR" = "true" ]; then ARGS+=(--sem-publicar); fi
          if [ -n "$FORMATO" ]; then ARGS+=(--formato "$FORMATO"); fi
          python main_gratis.py "${ARGS[@]}"

      - name: Guardar os vídeos para baixar (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bino-explica-${{ github.run_number }}
          path: |
            saida/**/*.mp4
            saida/**/miniatura.jpg
            saida/**/legendas.txt
            saida/**/roteiro.json
            saida/**/publicacao.json
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "bino-explica-bot"
          git config user.email "bino-explica-bot@users.noreply.github.com"
          for p in episodios historico.json tokens; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || (git commit -m "Histórico: novo vídeo" && git push)
