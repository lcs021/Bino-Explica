name: Montar episódio do site (com voz)

on:
  push:
    paths: ["episodios/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bino-explica
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg, desenhista de SVG e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-dejavu-core
          mkdir -p assets/fontes
          curl -fsSL -o assets/fontes/GochiHand-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/gochihand/GochiHand-Regular.ttf || echo "fonte manuscrita indisponível; usando a padrão"
          curl -fsSL -o assets/fontes/Poppins-Black.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Black.ttf || echo "fonte da thumbnail indisponível; usando a padrão"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Montar com voz (e publicar nas redes conectadas)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FONTE_LEGENDA: "Gochi Hand"
          FONTES_DIR: ${{ github.workspace }}/assets/fontes
          ESTILO_LEGENDA: rabisco
          ZOOM_VIDEO: "0.06"
        run: python montar_pacote.py

      - name: Guardar os vídeos para baixar (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodio-com-voz-${{ github.run_number }}
          path: |
            saida/**/*.mp4
            saida/**/miniatura.jpg
            saida/**/legendas.txt
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar o MP4 para baixar direto (aba Releases)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for d in saida/*/; do
            [ -d "$d" ] || continue
            nome=$(basename "$d" | cut -d_ -f3-)
            arquivos=()
            for f in "$d"*.mp4; do [ -e "$f" ] && cp "$f" "/tmp/${nome}.mp4" && arquivos+=("/tmp/${nome}.mp4") && break; done
            [ ${#arquivos[@]} -eq 0 ] && continue
            [ -f "${d}legendas.txt" ] && cp "${d}legendas.txt" "/tmp/${nome}-legenda.txt" && arquivos+=("/tmp/${nome}-legenda.txt")
            titulo=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['titulo'])" "${d}roteiro.json" 2>/dev/null || echo "$nome")
            n=$((n+1))
            gh release create "video-${{ github.run_number }}-${n}" "${arquivos[@]}" \
              --title "🎬 ${titulo}" --notes "Vídeo pronto para o TikTok. Toque no arquivo .mp4 para baixar." --latest
          done
          [ $n -eq 0 ] && echo "::warning::Nenhum vídeo foi montado nesta rodada." || echo "$n vídeo(s) publicados em Releases."

      - name: Salvar
        if: always()
        run: |
          git config user.name "bino-explica-bot"
          git config user.email "bino-explica-bot@users.noreply.github.com"
          for p in episodios historico.json tokens; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || (git commit -m "Episódio do site montado" && git pull --rebase -q && git push)
