name: Modo pago (Claude + OpenAI) — só manual

on:
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
    inputs:
      tema:
        description: "Tema (deixe vazio para o próximo da fila)"
        required: false
      sem_publicar:
        description: "Só criar os vídeos, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write             # para salvar o historico.json no repositório

concurrency:
  group: turibencao
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar e publicar vídeo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FONTE_LEGENDA: "DejaVu Sans"
          TEMA: ${{ inputs.tema }}
          SEM_PUBLICAR: ${{ inputs.sem_publicar }}
        run: |
          ARGS=()
          if [ -n "$TEMA" ]; then ARGS+=(--tema "$TEMA"); fi
          if [ "$SEM_PUBLICAR" = "true" ]; then ARGS+=(--sem-publicar); fi
          python main.py "${ARGS[@]}"

      - name: Guardar vídeos para download (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            saida/**/video_longo.mp4
            saida/**/video_curto.mp4
            saida/**/miniatura.jpg
            saida/**/roteiro.json
            saida/**/publicacao.json
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Salvar histórico (para não repetir temas)
        if: always()
        run: |
          git config user.name "turibencao-bot"
          git config user.email "turibencao-bot@users.noreply.github.com"
          git add historico.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Histórico: novo vídeo" && git push)
