name: Caso Ao Vivo (crimes reais)

on:
  push:
    paths: ["casos/*.json"]
  workflow_dispatch:
    inputs:
      exemplo:
        description: "Montar o caso de exemplo (assets/caso/exemplo.json) sem mexer na pasta casos"
        type: boolean
        default: false

permissions:
  contents: write

# Uma montagem por vez. Se você subir vários casos seguidos, o GitHub cancela as execuções que estavam
# só esperando na fila (aparecem em cinza como "cancelled"): é normal, a próxima que rodar monta todos.
concurrency:
  group: caso-ao-vivo
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ver se há casos na fila
        id: fila
        run: |
          git pull -q --rebase origin main || true
          if [ "${{ inputs.exemplo }}" = "true" ]; then cp assets/caso/exemplo.json casos/zz-exemplo-teste.json; fi
          n=$(ls casos/*.json 2>/dev/null | wc -l)
          echo "total=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then echo "Nenhum caso na pasta casos/ (já foram montados ou apagados)."; fi

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.total != '0'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg e fontes
        if: steps.fila.outputs.total != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p assets/fontes
          curl -fsSL -o assets/fontes/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "fonte Anton indisponível; usando a padrão"
          curl -fsSL -o assets/fontes/DMSerifDisplay-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/dmserifdisplay/DMSerifDisplay-Regular.ttf || echo "fonte serifada indisponível; usando a padrão"
          curl -fsSL -o "assets/fontes/Rubik[wght].ttf" \
            "https://github.com/google/fonts/raw/main/ofl/rubik/Rubik%5Bwght%5D.ttf" || echo "fonte Rubik indisponível; usando a padrão"
          curl -fsSL -o assets/fontes/JetBrainsMono-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" || echo "fonte mono indisponível; usando a padrão"

      - name: Instalar dependências
        if: steps.fila.outputs.total != '0'
        run: pip install -r requirements.txt opencv-python-headless

      - name: Narrar e editar os vídeos
        if: steps.fila.outputs.total != '0'
        run: python montar_caso.py

      - name: Guardar os vídeos para baixar (30 dias)
        if: always() && steps.fila.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: caso-ao-vivo-${{ github.run_number }}
          path: |
            saida/casos/**/*.mp4
            saida/casos/**/legendas.srt
            saida/casos/**/post.txt
            saida/casos/**/pacote-de-producao.md
            saida/casos/**/imagens/*
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Relatório (vídeo e quadros no ramo teste-caso)
        if: always() && steps.fila.outputs.total != '0'
        run: |
          d=$(ls -d saida/casos/*/ | head -1)
          mkdir -p /tmp/rel && cp "$d"pacote-de-producao.md "$d"legendas.srt "$d"imagens/creditos.txt /tmp/rel/ 2>/dev/null || true
          cp logs/*.log /tmp/rel/ 2>/dev/null || true
          v=$(ls "$d"*.mp4 | head -1)
          for t in 1 4 7 10 13 16 19 22 25 28 31 34; do ffmpeg -v error -y -ss $t -i "$v" -frames:v 1 -vf scale=360:640 /tmp/rel/q_$t.jpg || true; done
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$v" > /tmp/rel/duracao.txt
          cp "$v" /tmp/rel/video.mp4
          ffmpeg -v info -i "$v" -af ebur128=framelog=quiet -f null - 2>&1 | grep -A2 "Integrated" > /tmp/rel/volume.txt || true
          cd /tmp/rel && git init -q && git checkout -q -b teste-caso && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m "relatório do teste"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" teste-caso

      - name: Salvar
        if: always() && steps.fila.outputs.total != '0'
        run: |
          rm -f casos/zz-exemplo-teste.json casos/feitos/zz-exemplo-teste.json
          git config user.name "bino-explica-bot"
          git config user.email "bino-explica-bot@users.noreply.github.com"
          git add -A casos
          if ! git diff --cached --quiet; then
            git commit -q -m "Caso Ao Vivo montado"
            for i in 1 2 3; do
              if git pull -q --rebase -X theirs origin main && git push -q; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Não consegui atualizar a pasta casos (alguém mexeu nela ao mesmo tempo). Os vídeos já estão em Artifacts."
          fi
