name: Caso Ao Vivo (crimes reais)

on:
  push:
    paths: ["casos/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bino-explica
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p assets/fontes
          curl -fsSL -o assets/fontes/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "fonte Anton indisponível; usando a padrão"
          curl -fsSL -o "assets/fontes/Rubik[wght].ttf" \
            "https://github.com/google/fonts/raw/main/ofl/rubik/Rubik%5Bwght%5D.ttf" || echo "fonte Rubik indisponível; usando a padrão"
          curl -fsSL -o assets/fontes/JetBrainsMono-Bold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" || echo "fonte mono indisponível; usando a padrão"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Narrar com a voz do Bino e montar o vídeo
        run: python montar_caso.py

      - name: Guardar os vídeos para baixar (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caso-ao-vivo-${{ github.run_number }}
          path: |
            saida/casos/**/*.mp4
            saida/casos/**/legendas.srt
            saida/casos/**/post.txt
            logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Salvar
        if: always()
        run: |
          git config user.name "bino-explica-bot"
          git config user.email "bino-explica-bot@users.noreply.github.com"
          git add -A casos
          git diff --cached --quiet || (git commit -m "Caso Ao Vivo montado" && git pull --rebase -q && git push)
